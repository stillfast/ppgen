# U **14 valence electrons** (5f3 6s2 6p6 6d1 7s2) + pseudotype=2 -- final parameters
#
# How the values were determined (two steps):
#   1) an rcut scan (±0.5 bohr, 0.1 steps, 55 points, 45 usable) fixes
#      6S 1.5 | 7S 1.2 | 6P 1.2(a) | 6D 2.4 | 5F 1.3
#   2) a focused refinement scan exposed two problems, both now fixed:
#      * **l=1 has a ghost state**: the PS side carries one extra pole at +2.72 Ry (AE/PS pole count 1/2) --
#        adding a **second p projection operator** (occ=0, reference energy −0.25 Ry) removes it:
#        l=1 becomes 1/1 with ΔE 0.0002 Ry ✓ (6P rcut = 1.2/1.6/1.8 are all equally effective)
#      * **l=3/l=4 are off by 0.045 Ry**: dominated by the local potential (`rcloc`) -- with rcloc 2.5 → 2.2
#        they drop to l=3 0.0227 and l=4 0.0273, and all six channels **align** (≤0.04 Ry)
#        (rcloc 2.8 is worse: l=3 0.0685; rcloc 2.0 makes l=0 slightly worse at 0.0195)
#      * rcloc = 2.2 also presses the projection operator cutoff down to ~2.2 bohr = **1.16 Å**,
#        which satisfies "β is zero beyond 1.5 Å" (the β cutoff is set by rcloc, not by rcut)
#
# Final: 6S 1.5 | 7S 1.2 | 6P 1.6 (two projection operators) | 6D 2.4 | 5F 1.3, rcloc 2.2
# Pole shifts for the six channels: l=0 0.0138 | l=1 0.0002 | l=2 0.0255 | l=3 0.0227 | l=4 0.0273 | l=5 0.0032 Ry

input:
  title: 'U 14 valence electrons (5f3 6s2 6p6 6d1 7s2) scalar-relativistic NC, PBE'
  atom: 'U'
  dft: 'PBE'
  config: '[Rn] 5f3 6d1 7s2'
  rel: 1
  iswitch: 3
  nld: 6
  rlderiv: 5.0
  eminld: -3.0
  emaxld: 3.0
  deld: 0.02

inputp:
  pseudotype: 2
  file_pseudopw: 'U.pbe-n-nc.UPF'
  author: 'Guozhou Li'
  lloc: -2
  rcloc: 2.2
  nlcc: true
  tm: true
  new_core_ps: true
  file_beta: 'U.beta'

n_orbitals: 6
orbitals:
  - ['6S', 1, 0, 2.00, 0.00, 1.5, 1.5, 0.0]
  - ['7S', 2, 0, 2.00, 0.00, 1.2, 1.2, 0.0]
  - ['6P', 2, 1, 6.00, 0.00, 1.6, 1.6, 0.0]
  - ['6D', 3, 2, 1.00, 0.00, 2.4, 2.4, 0.0]
  - ['5F', 4, 3, 3.00, 0.00, 1.3, 1.3, 0.0]
  - ['6P', 2, 1, 0.00, -0.25, 1.6, 1.6, 0.0]   # second projection operator for l=1 (removes the ghost state)

test:
  nconf: 1
  'configts(1)': '5f3 6s2 6p6 6d1 7s2'
  ecutmin: 20.0
  ecutmax: 200.0
  decut: 20.0
  rm: 30.0
