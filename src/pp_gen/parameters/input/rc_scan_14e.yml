# U, **14 valence electrons** (5f3 6s2 6p6 6d1 7s2) + pseudotype=2 (multiple projectors / separable form)
#
# Why 14 valence electrons + pseudotype=2:
#   * 6s2 has to be treated as a valence state (the rcut tables and the δ configurations all include 6s2),
#     and 6s/7s are the **same l** ⇒ pseudotype=1 fails at once with
#     `Two wavefunctions for the same l` (ld1_readin.f90:436); only pseudotype=2
#     can supply two projection operators for l=0 at the same time.
#   * zval follows automatically as `Z − Σ occ(config) + Σ occ(configts(1))` = 14 (config lists all
#     92 electrons, configts(1) has 14) ⇒ the orbital card occupancies must also sum to 14: 2+2+6+1+3 = 14 ✓
#
# Initial rcut values taken from the outer peak of the AE radial wavefunctions:
#   6S 1.3474 → 1.3 | 7S 1.1773 → 1.2 | 6P 1.6132 → 1.6 | 6D 2.4066 → 2.4 | 5F 1.0599 → 1.1
# An rcut scan within ±0.5 bohr then picks each channel by lowest total pole ΔE, then median |ΔL|.
#
# rcloc = 2.5: the **cutoff radius of the projection operators β is set by rcloc, not by rcut**
#   (rcloc 2.5 → β ends at 2.50 bohr = 1.32 Å; 2.7 → 1.43 Å; 2.0 → 1.06 Å)
#   ⇒ to satisfy "β is zero beyond 1.5 Å", rcloc only has to stay ≤ ~2.8 bohr ✓
#
# nld = 6 (≥ lmax+1 = 4): dlog files have nld columns (l=0…5) and l=4/5 have no projection operator, so they
#   probe the local potential alone. Keep nld fixed across one scan run: it is **independent** of the card count.
#
# This template **deliberately holds only 5 orbital cards** (one per channel), so writing rcut back channel by
# channel is unambiguous; to add the "second projection operator for l=1" (an occ=0 reference state), a sixth card is needed.

input:
  title: 'U 14 valence electrons (5f3 6s2 6p6 6d1 7s2) scalar-relativistic NC, PBE'
  atom: 'U'
  dft: 'PBE'
  config: '[Rn] 5f3 6d1 7s2'
  rel: 1
  iswitch: 3
  nld: 6
  rlderiv: 5.0
  eminld: -3.0
  emaxld: 3.0
  deld: 0.02

inputp:
  pseudotype: 2
  file_pseudopw: 'U.pbe-n-nc.UPF'
  author: 'Guozhou Li'
  lloc: -2
  rcloc: 2.5
  nlcc: true
  tm: true
  new_core_ps: true
  file_beta: 'U.beta'

n_orbitals: 5
orbitals:
  - ['6S', 1, 0, 2.00, 0.00, 1.5, 1.5, 0.0]
  - ['7S', 2, 0, 2.00, 0.00, 1.2, 1.2, 0.0]
  - ['6P', 2, 1, 6.00, 0.00, 1.2, 1.2, 0.0]
  - ['6D', 3, 2, 1.00, 0.00, 2.4, 2.4, 0.0]
  - ['5F', 4, 3, 3.00, 0.00, 1.3, 1.3, 0.0]

test:
  nconf: 1
  'configts(1)': '5f3 6s2 6p6 6d1 7s2'
  ecutmin: 20.0
  ecutmax: 200.0
  decut: 20.0
  rm: 30.0
