# **Transferability (δ) test** for the U 14 valence electron pseudopotential: iswitch=2 runs 5 configurations at once,
# configuration 1 is the generation configuration (5f3 6s2 6p6 6d1 7s2, 14 electrons) and 2..5 are four other occupations,
# the report gives the AE/PS total energy difference ΔE and δ = ΔE_PS − ΔE_AE (mRy) for each configuration.
#
# Key point: **every state in a test configuration must have a matching channel in the pseudopotential** (here all five channels 6s/6p/6d/7s/5f are present)
# -- otherwise the PS side solves that state in "someone else's channel" and the resulting error is spurious (for example, with only a 7S channel
# a test configuration containing 6s2 reports 6S off by 37 mRy, which is an artefact).
#
# file_pseudo points at the UPF under test.
input:
  title: 'U 14 valence electrons (5f3 6s2 6p6 6d1 7s2) scalar-relativistic NC, PBE'
  atom: 'U'
  dft: 'PBE'
  config: '[Rn] 5f3 6d1 7s2'
  rel: 1
  iswitch: 2
  nld: 4
  rlderiv: 3.0
  eminld: -3.0
  emaxld: 3.0
  deld: 0.02

test:
  nconf: 5
  'configts(1)': '5f3 6s2 6p6 6d1 7s2'
  'configts(2)': '5f3 6s2 6p6 6d0 7s2'
  'configts(3)': '5f3 6s2 6p6 6d1 7s1'
  'configts(4)': '5f3 6s2 6p6 6d2 7s1'
  'configts(5)': '5f3 6s2 6p6 6d2 7s0'
  file_pseudo: '/home/liguozhou/oncv/uranium-ppgen/v13/pp/U.pbe-n-nc.UPF'
  ecutmin: 20.0
  ecutmax: 200.0
  decut: 20.0
  rm: 30.0
