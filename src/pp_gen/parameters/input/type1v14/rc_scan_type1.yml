input:
  title: 'U 14 valence electrons (5f3 6p6 6d1 7s2) scalar-relativistic NC, PBE, 6s2 in core'
  atom: 'U'
  dft: 'PBE'
  # 写全 92 个电子：6s2 6p6 都在**芯**里（它们不出现在卡片上），价 = 5f3 6p6 6d1 7s2
  config: '1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 5f3 6s2 6p6 6d1 7s2'
  rel: 1
  iswitch: 3
  nld: 4
  rlderiv: 5.0
  eminld: -3.0
  emaxld: 3.0
  deld: 0.02

inputp:
  pseudotype: 1
  file_pseudopw: 'U.pbe-n-nc.UPF'
  author: 'Guozhou Li'
  lloc: -2
  rcloc: 2.7
  nlcc: true
  tm: true
  new_core_ps: true
  file_beta: 'U.beta'
  zval: 12           # = 卡片占据数之和 = 6p6 + 6d1 + 7s2 + 5f3

n_orbitals: 4
orbitals:
  - ['7S', 2, 0, 2.00, 0.00, 1.4, 1.4, 0.0]
  - ['6P', 2, 1, 6.00, 0.00, 1.75, 1.75, 0.0]
  - ['6D', 3, 2, 1.00, 0.00, 2.35, 2.35, 0.0]
  - ['5F', 4, 3, 3.00, 0.00, 1.15, 1.15, 0.0]

# 故意不给 test 段（原因见文件头）。要恢复 QE 的 Bessel 盒子测试，就得写
# configts(1)，而那正是上面那个崩溃的触发条件 —— 二选一。

# ---------------------------------------------------------------------------
# 14 价电子备选（同一份 pseudotype=1 也能跑，但 6S 通道会差 37 mRy）：
#
# input:
#   title: 'U 14 valence electrons (5f3 6s2 6p6 6d1 7s2) scalar-relativistic NC, PBE'
#   config: '1s2 … 5d10 5f3 6s2 6p6 6d1 7s2'      （其余 &input 同上）
# inputp:
#   同上传参，但要 **去掉 zval**（让 QE 自己按 (Z−Σconfig)+Σ卡片 算出 14）
# n_orbitals: 5
# orbitals:
#   - ['6S', 1, 0, 2.00, 0.00, 1.40, 1.40, 0.0]
#   - ['7S', 2, 0, 2.00, 0.00, 1.40, 1.40, 0.0]
#   - ['6P', 2, 1, 6.00, 0.00, 1.75, 1.75, 0.0]
#   - ['6D', 3, 2, 1.00, 0.00, 2.35, 2.35, 0.0]
#   - ['5F', 4, 3, 3.00, 0.00, 1.15, 1.15, 0.0]
#
# 实测：退出码 0、valence charge 14、eps ~1e-15 / iter ≈ 16，
# 五态 Δ = 5F 0.18 / 6S 37 / 6P 0.01 / 6D 0.00 / 7S 0.01 mRy（6S 被 QE 打了 `!`）。
# 6s 想当一个**独立通道**且精度好，目前只有 pseudotype=2（6S+7S 双投影）那套：
# 6S 0.05 mRy、δ ≈ 1 mRy。
# ---------------------------------------------------------------------------
