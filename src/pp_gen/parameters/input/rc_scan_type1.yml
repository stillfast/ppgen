# U, **12 valence electrons** (5f3 6p6 6d1 7s2) + pseudotype=1 (single projector, semilocal)
#
# ✅ This template **runs successfully** (QE 7.4). Criteria (do not look at the exit code alone):
#       valence charge is 12.00
#       self-test table  eps = 6.2E-16   iter = 6
#       7S −0.00001 / 6P 0.00001 / 6D −0.00000 / 5F −0.00018 Ry   ← all four states ≤0.2 mRy, no `!`
#
# ⚠ The one crucial point: **when generating 12 valence electrons with pseudotype=1, do not write a `&test` section.**
#
#   As soon as `configts(1)` is written inside `&test` (for example '5f3 6p6 6d1 7s2'), the QE **internal self-test** fails:
#       Warning: n=2, l=1 expected 0 nodes, found 1
#       Error in routine run_pseudo (1): Errors in PS-KS equation
#   Mechanism (visible in the source):
#     * the self-test PS-KS equation is solved by ascheqps, which uses `ndcr = nam − l − 1` to decide "how many nodes the channel should have"
#       (ascheqps.f90:108).
#     * **the n column of an orbital card follows the "pseudo-wavefunction node convention"** (this template 7S→2 / 6P→2 / 6D→3 / 5F→4, expecting 1/0/0/0 nodes,
#       which is what the solver actually finds); **the n in a configts string is the true principal quantum number** (5/6/6/7) → the two disagree →
#       the solver believes it has the wrong eigenvalue, brackets back and forth 100 times without converging → `nstop=1` (ascheqps.f90:267) →
#       `run_pseudo.f90:148`: with `nerr /= 0` and `iswitch == 3` it exits through errore
#       (`iswitch == 2` only prints one BEWARE line, so a silent iswitch=2 run is not a pass).
#     * by then **generation has long printed "End of pseudopotential generation"** -- generation is not the problem, the self-test configuration is wrong.
#       Control run with the same cards and no `&test` section: exit code 0, UPF written normally, self-test eps 6.2e-16 / iter 6.
#     * configts cannot be left empty inside `&test` either: QE then reads the second set of cards → read_psconfig errors out.
#   → so this template **writes no test section**: the self-test reuses the same card states as generation and passes cleanly.
#     For a separate transferability / logarithmic derivative check, run the configts test (iswitch=2) with rlderiv / logfunction.
#
# Two more criteria worth recording:
#   * the read-in check for `zval` (ld1_readin.f90:583-603) is
#         zval == (Z − Σ occ(config)) + Σ occ(configts(1))
#     with config listing all 92 electrons the first term is 0 → when configts is given, zval must equal the electron count of that string
#     (that is where the "supplied (12.00) and calculated (14.00)" message comes from).
#     **the orbital card occupancies do not take part in this check**, so a wrong value is not reported at read-in but ruins the self-test.
#   * pseudotype=1 allows no two orbital cards with the same l (QE reports `Two wavefunctions for the same l` directly)
#     -- that is why 6s cannot both stay in the core and act as a channel; two s channels (6s/7s) require pseudotype=2.
#   * a card for an occupied state (occ>0) must not carry a non-zero ener; only occ=0 cards may set it.

input:
  title: 'U 12 valence electrons (5f3 6p6 6d1 7s2) scalar-relativistic NC, PBE, 6s2 in core'
  atom: 'U'
  dft: 'PBE'
  # all 92 electrons listed: 6s2 and 6p6 stay in the **core** (they do not appear as orbital cards), valence = 5f3 6p6 6d1 7s2
  config: '1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 5f3 6s2 6p6 6d1 7s2'
  rel: 1
  iswitch: 3
  nld: 4
  rlderiv: 5.0
  eminld: -3.0
  emaxld: 3.0
  deld: 0.02

inputp:
  pseudotype: 1
  file_pseudopw: 'U.pbe-n-nc.UPF'
  author: 'Guozhou Li'
  lloc: -2
  rcloc: 2.7
  nlcc: true
  tm: true
  new_core_ps: true
  file_beta: 'U.beta'
  zval: 12           # = sum of the orbital card occupancies = 6p6 + 6d1 + 7s2 + 5f3

n_orbitals: 4
orbitals:
  - ['7S', 2, 0, 2.00, 0.00, 1.4, 1.4, 0.0]
  - ['6P', 2, 1, 6.00, 0.00, 1.75, 1.75, 0.0]
  - ['6D', 3, 2, 1.00, 0.00, 2.35, 2.35, 0.0]
  - ['5F', 4, 3, 3.00, 0.00, 1.15, 1.15, 0.0]

# No test section on purpose (see the explanation above). Restoring the QE Bessel box test requires
# configts(1), which is exactly what triggers the failure described above -- it is either one or the other.

