[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pp-gen"
version = "0.1.0"
description = "Pseudopotential generation pipeline (prepare / run / plot / report)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["PyYAML>=5.4", "numpy>=1.20"]

[project.optional-dependencies]
# matplotlib is imported lazily, so prepare / run work without it
plot = ["matplotlib>=3.5"]
dev = ["pytest>=7.0", "matplotlib>=3.5"]

[project.scripts]
ppgen = "pp_gen.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pp_gen*"]

[tool.setuptools.package-data]
"pp_gen.parameters" = ["*.yml", "input/*.yml"]

[tool.pytest.ini_options]
testpaths = ["test"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: integration tests that run the local ld1.x (skip with -m 'not slow')",
]
