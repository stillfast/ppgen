# U **14 价电子**（5f3 6s2 6p6 6d1 7s2）+ pseudotype=2 —— v13 定稿参数
#
# 参数来源（两步定下来）：
#   1) rc_scan（rc_scan_14e.yml，±0.5 bohr / 0.1，共 55 点、45 点可用）定出
#      6S 1.5 | 7S 1.2 | 6P 1.2(a) | 6D 2.4 | 5F 1.3
#   2) 专项小扫描（v13/sweep）发现两个问题并修掉：
#      * **l=1 有鬼态**：PS 侧在 +2.72 Ry 多一个极点（AE/PS 极点个数 1/2）——
#        加**第二个 p 投影算子**（occ=0、参考能量 −0.25 Ry）后消失：
#        l=1 变成 1/1、ΔE 0.0002 Ry ✓（试 6P rcut = 1.2/1.6/1.8 都一样有效）
#      * **l=3/l=4 偏 0.045 Ry**：由局域势（`rcloc`）主导 —— rcloc 2.5→2.2 后
#        l=3 0.0452→0.0227、l=4 0.0451→0.0273，六个通道**全部重合**（≤0.04 Ry）
#        （rcloc 2.8 更差：l=3 0.0685；2.0 时 l=0 稍差 0.0195）
#      * rcloc = 2.2 还顺带把投影算子截断压到 ~2.2 bohr = **1.16 Å**，
#        满足「β 在 1.5 Å 后为 0」（β 的截断由 rcloc 决定，不是 rcut）
#
# 最终：6S 1.5 | 7S 1.2 | 6P 1.6（两个投影算子）| 6D 2.4 | 5F 1.3，rcloc 2.2
# 六通道极点：l=0 0.0138 | l=1 0.0002 | l=2 0.0255 | l=3 0.0227 | l=4 0.0273 | l=5 0.0032 Ry

input:
  title: 'U 14 valence electrons (5f3 6s2 6p6 6d1 7s2) scalar-relativistic NC, PBE'
  atom: 'U'
  dft: 'PBE'
  config: '[Rn] 5f3 6d1 7s2'
  rel: 1
  iswitch: 3
  nld: 6
  rlderiv: 5.0
  eminld: -3.0
  emaxld: 3.0
  deld: 0.02

inputp:
  pseudotype: 2
  file_pseudopw: 'U.pbe-n-nc.UPF'
  author: 'Guozhou Li'
  lloc: -2
  rcloc: 2.2
  nlcc: true
  tm: true
  new_core_ps: true
  file_beta: 'U.beta'

n_orbitals: 6
orbitals:
  - ['6S', 1, 0, 2.00, 0.00, 1.5, 1.5, 0.0]
  - ['7S', 2, 0, 2.00, 0.00, 1.2, 1.2, 0.0]
  - ['6P', 2, 1, 6.00, 0.00, 1.6, 1.6, 0.0]
  - ['6D', 3, 2, 1.00, 0.00, 2.4, 2.4, 0.0]
  - ['5F', 4, 3, 3.00, 0.00, 1.3, 1.3, 0.0]
  - ['6P', 2, 1, 0.00, -0.25, 1.6, 1.6, 0.0]   # l=1 的第二个投影算子（消鬼态）

test:
  nconf: 1
  'configts(1)': '5f3 6s2 6p6 6d1 7s2'
  ecutmin: 20.0
  ecutmax: 200.0
  decut: 20.0
  rm: 30.0
