input:
  title: 'U 14 valence electrons (5f3 6s2 6p6 6d1 7s2) scalar-relativistic NC, PBE'
  atom: 'U'
  dft: 'PBE'
  config: '[Rn] 5f3 6d1 7s2'
  rel: 1
  iswitch: 3
  nld: 4
  rlderiv: 4.1      # reference radius for the logarithmic derivative (a.u.): 4.1 = 2.17 Å, near the U–O bond midpoint in UO2
                    # 4.1 is preferred over 3.0: all four channels then show a lower median |ΔL|, smaller pole shifts and no ghost state
  eminld: -5.0
  emaxld: 5.0
  deld: 0.02

inputp:
  pseudotype: 3
  file_pseudopw: 'U.pbe-n-nc.UPF'
  author: 'Guozhou Li'
  lloc: -2
  rcloc: 2.0
  nlcc: true
  tm: true
  new_core_ps: true

n_orbitals: 7
orbitals:
  - ['6S', 1, 0, 2.00, 0.00, 1.2, 1.2, 0.0]
  - ['7S', 2, 0, 2.00, 0.00, 1.2, 1.2, 0.0]
  - ['6P', 2, 1, 6.00, 0.00, 1.8, 1.8, 0.0]
  - ['6D', 3, 2, 1.00, 0.00, 2.4, 2.4, 0.0]
  - ['5F', 4, 3, 3.00, 0.00, 1.2, 1.2, 0.0]
  # multiple projectors (only pseudotype=3 supports them correctly): occupancy=0 plus an explicit ener attaches
  # a second projection operator to the same l -- both its position and its energy dependence are tunable, and it
  # brings the pole shifts of l=2 and l=3 from 0.14/0.04 down to 0.00 and the median |ΔL| from 4.0e-3/2.5e-3 to 3.6e-4/7.0e-4
  - ['6D', 3, 2, 0.00, -0.05, 2.4, 2.4, 0.0]
  - ['5F', 4, 3, 0.00, -0.30, 1.2, 1.2, 0.0]

test:
  nconf: 1
  'configts(1)': '5f3 6s2 6p6 6d1 7s2'
  ecutmin: 20.0
  ecutmax: 200.0
  decut: 20.0
  rm: 30.0