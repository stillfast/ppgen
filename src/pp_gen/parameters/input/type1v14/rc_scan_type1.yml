input:
  title: 'U 14 valence electrons (5f3 6p6 6d1 7s2) scalar-relativistic NC, PBE, 6s2 in core'
  atom: 'U'
  dft: 'PBE'
  # all 92 electrons listed: 6s2 and 6p6 stay in the **core** (they do not appear as orbital cards), valence = 5f3 6p6 6d1 7s2
  config: '1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 5f3 6s2 6p6 6d1 7s2'
  rel: 1
  iswitch: 3
  nld: 4
  rlderiv: 5.0
  eminld: -3.0
  emaxld: 3.0
  deld: 0.02

inputp:
  pseudotype: 1
  file_pseudopw: 'U.pbe-n-nc.UPF'
  author: 'Guozhou Li'
  lloc: -2
  rcloc: 2.7
  nlcc: true
  tm: true
  new_core_ps: true
  file_beta: 'U.beta'
  zval: 12           # = sum of the orbital card occupancies = 6p6 + 6d1 + 7s2 + 5f3

n_orbitals: 4
orbitals:
  - ['7S', 2, 0, 2.00, 0.00, 1.4, 1.4, 0.0]
  - ['6P', 2, 1, 6.00, 0.00, 1.75, 1.75, 0.0]
  - ['6D', 3, 2, 1.00, 0.00, 2.35, 2.35, 0.0]
  - ['5F', 4, 3, 3.00, 0.00, 1.15, 1.15, 0.0]

# No test section on purpose. Restoring the QE Bessel box test requires writing
# configts(1), which breaks the self-test of this 12-valence pseudotype=1 setup -- it is either one or the other.

# ---------------------------------------------------------------------------
# Alternative 14 valence electron setup (the same pseudotype=1 runs, but the 6S channel is off by 37 mRy):
#
# input:
#   title: 'U 14 valence electrons (5f3 6s2 6p6 6d1 7s2) scalar-relativistic NC, PBE'
#   config: '1s2 … 5d10 5f3 6s2 6p6 6d1 7s2'      (rest of &input unchanged)
# inputp:
#   same namelist parameters, but **drop zval** (let QE derive 14 from (Z−Σconfig)+Σcard occupancies)
# n_orbitals: 5
# orbitals:
#   - ['6S', 1, 0, 2.00, 0.00, 1.40, 1.40, 0.0]
#   - ['7S', 2, 0, 2.00, 0.00, 1.40, 1.40, 0.0]
#   - ['6P', 2, 1, 6.00, 0.00, 1.75, 1.75, 0.0]
#   - ['6D', 3, 2, 1.00, 0.00, 2.35, 2.35, 0.0]
#   - ['5F', 4, 3, 3.00, 0.00, 1.15, 1.15, 0.0]
#
# With these cards: exit code 0, valence charge 14, eps ~1e-15 / iter ≈ 16,
# five states Δ = 5F 0.18 / 6S 37 / 6P 0.01 / 6D 0.00 / 7S 0.01 mRy (QE flags 6S with `!`).
# an accurate **standalone channel** for 6s requires pseudotype=2 (the 6S+7S double projector setup), which gives:
# 6S 0.05 mRy and δ ≈ 1 mRy.
# ---------------------------------------------------------------------------
